version: '3.8'

services:
  # NGINX Load Balancer
  nginx:
    image: nginx:alpine
    container_name: nginx_lb
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-1
      - app-2
      - app-3

  # Application Instances
  app-1:
    build: .
    environment:
      - PORT=5000
      - NODE_ENV=production
    restart: always

  app-2:
    build: .
    environment:
      - PORT=5000
      - NODE_ENV=production
    restart: always

  app-3:
    build: .
    environment:
      - PORT=5000
      - NODE_ENV=production
    restart: always
