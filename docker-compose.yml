services:
  backend:
    build: .
    image: ayushnegi/ws-backend:latest
    container_name: ws-backend
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      - mongodb
    networks:
      - app-network

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data:
