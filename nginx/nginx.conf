worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Compression settings
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. Scaling: Define the Backend App Cluster
    upstream node_app_cluster {
        # 'ip_hash' ensures a client always connects to the same server.
        # This is CRITICAL for WebSockets if you don't use a Redis adapter.
        ip_hash;

        server app-1:5000;
        server app-2:5000;
        server app-3:5000;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            # Proxy requests to the cluster
            proxy_pass http://node_app_cluster;

            # 2. WebSocket Support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 3. Standard Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for long-running WebSocket connections
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Health monitoring (Optional)
        location /nginx_status {
            stub_status;
        }
    }
}
